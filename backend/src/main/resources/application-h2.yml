spring:
  datasource:
    url: jdbc:h2:file:./data/readerscircle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  jwt:
    secret: local-development-secret-key-readers-circle-32chars
