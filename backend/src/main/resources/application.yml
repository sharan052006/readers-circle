spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/readerscircle}}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  jwt:
    # Fail-fast check for JWT_SECRET lands in Task 3 (SecurityConfig/JwtService).
    # Placeholder default lets Task 1 scaffold boot without security wired yet.
    secret: ${JWT_SECRET:change-me-in-env-min-32-chars-long-placeholder}
    access-minutes: 15
    refresh-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://readers-circle-nine.vercel.app,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  upload:
    dir: ${UPLOAD_DIR:uploads/gallery}
    max-per-minute: ${UPLOAD_MAX_PER_MINUTE:30}
