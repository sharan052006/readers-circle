spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/readers_circle}
    username: ${SPRING_DATASOURCE_USERNAME:readers}
    password: ${SPRING_DATASOURCE_PASSWORD:readers}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 7

app:
  admin-email: ${ADMIN_EMAIL:admin@readers.local}
  admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
  admin-name: ${ADMIN_NAME:Platform Admin}

server:
  port: 8080
