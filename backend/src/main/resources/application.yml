spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readerscircle}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: 8080

app:
  jwt:
    # Fail-fast check for JWT_SECRET lands in Task 3 (SecurityConfig/JwtService).
    # Placeholder default lets Task 1 scaffold boot without security wired yet.
    secret: ${JWT_SECRET:change-me-in-env-min-32-chars-long-placeholder}
    access-minutes: 15
    refresh-days: 7
