<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reader's Circle — Your reading home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6; --card:#FFFDF9; --border:#E5DED2;
  --ink:#241A12; --muted:#6B6257; --faint:#8A8175;
  --burgundy:#6B2A1F; --burgundy-deep:#4E1E15;
  --palm:#2F5D50; --marigold:#D9A21B;
  --pill:#F1EDE3; --heart:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55}
:focus-visible{outline:3px solid var(--palm);outline-offset:2px;border-radius:8px}
button,input{font:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
/* Left rail */
.rail{border-right:1px solid var(--border);background:#FDFCF8;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--burgundy);color:#fff;display:grid;place-items:center;font-size:18px}
.brand b{font-family:'Fraunces',serif;font-size:17px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:#F3EEE1}
.nav a[aria-current="page"]{background:#F5E9DD;font-weight:700}
.nav a svg{flex:none}
.syncnote{margin-top:auto;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);font-size:12px;color:var(--muted)}
.syncnote b{color:var(--palm)}
/* Main column */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 38px;background:#fff}
.search .lens{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.topright{margin-left:auto;display:flex;align-items:center;gap:12px}
.bell{position:relative;border:1px solid var(--border);background:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bell .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#D33;border:2px solid #fff}
.bell .count{position:absolute;top:-6px;right:-6px;background:var(--burgundy);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px}
.userchip{display:flex;align-items:center;gap:9px;border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:12px}
.userchip .face{width:32px;height:32px;border-radius:50%;background:#EAD9C2;display:grid;place-items:center;font-weight:700}
.userchip b{font-size:13.5px}
.drop{position:absolute;top:56px;right:20px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 44px rgba(36,26,18,.14);padding:8px;min-width:230px;z-index:20}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:9px;cursor:pointer}
.drop button:hover{background:#F5F0E4}
/* Content grid */
.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 26px 48px;max-width:1280px;width:100%;align-items:start}
/* Feed */
.feed{display:flex;flex-direction:column;gap:16px;min-width:0}
.post{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px 14px}
.post + .post{margin-top:2px}
.byline{display:flex;align-items:center;gap:10px}
.byline .face{width:36px;height:36px;border-radius:50%;background:#E7DCC8;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.byline .face img{width:100%;height:100%;object-fit:cover}
.byline .who{min-width:0}
.byline .who b{font-size:13.5px;display:block;line-height:1.25}
.byline .who span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:#2B5F8A;background:#E8F0F8;border-radius:999px;padding:5px 12px;white-space:nowrap}
.kebab{border:0;background:none;cursor:pointer;color:var(--faint);font-size:18px;padding:4px 8px;border-radius:8px}
.postgrid{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:16px;margin-top:10px}
.post h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.18;margin:0 0 8px;letter-spacing:-.012em}
.post .excerpt{margin:0;color:#3E352B;max-width:68ch}
.cover{width:168px;height:190px;object-fit:cover;border-radius:10px;background:#EEE5D3;display:block;box-shadow:inset 6px 0 10px rgba(60,30,10,.22)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tags span{background:var(--pill);border-radius:999px;padding:5px 12px;font-size:12.5px;color:#4A4238}
.actions{display:flex;align-items:center;gap:18px;margin-top:10px;font-size:13px;color:var(--muted)}
.like{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;padding:6px 4px;border-radius:8px}
.like .h{color:var(--heart);font-size:17px}
.like[aria-pressed="true"] .h{color:var(--heart)}
.commentrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.commentrow .face{width:30px;height:30px;border-radius:50%;background:#EAD9C2;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.commentrow input{flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff}
/* Right rail */
.railcards{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.panel h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.rank{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #F0EAD9}
.rank:first-of-type{border-top:0}
.rank .n{width:32px;height:32px;border-radius:50%;background:#F3ECDC;display:grid;place-items:center;font-weight:700;flex:none}
.rank img{width:48px;height:64px;object-fit:cover;border-radius:7px;background:#EEE;flex:none;box-shadow:inset 4px 0 7px rgba(60,30,10,.25)}
.rank b{font-size:13.5px;display:block;line-height:1.3}
.rank span{font-size:12px;color:var(--muted);display:block}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid #F0EAD9;align-items:center}
.ev:first-of-type{border-top:0}
.ev .n{width:32px;height:32px;border-radius:50%;background:#F3ECDC;display:grid;place-items:center;font-weight:700;flex:none}
.ev img{width:56px;height:56px;object-fit:cover;border-radius:9px;flex:none}
.ev b{font-size:13px;display:block;line-height:1.35}
.ev span{font-size:12px;color:var(--muted);display:block}
.notice{border:1px solid var(--border);border-radius:14px;padding:16px;background:#FFF8E8;font-size:13px}
.err{border:1px solid #E3A9A9;background:#FDECEC;color:#7A1F1F;border-radius:14px;padding:14px 16px}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.empty b{font-family:'Fraunces',serif;color:var(--burgundy);font-size:18px;display:block;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1080px){.content{grid-template-columns:1fr}.railcards{position:static}.postgrid{grid-template-columns:1fr}.cover{width:100%;height:220px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.syncnote{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Reader navigation">
    <div class="brand"><span class="mark">📖</span><b>Reader's Circle</b></div>
    <nav class="nav">
      <a href="reader.html" aria-current="page"><span>⌂</span> Dashboard</a>
      <a href="reader-circles.html"><span>👥</span> Circles</a>
      <a href="reader-events.html"><span>📅</span> Events</a>
      <a href="reader-chat.html"><span>💬</span> Chat</a>
      <a href="reader-settings.html"><span>⚙</span> Settings</a>
    </nav>
    <div class="syncnote" id="syncNote">Live data from the same service as admin.<br><b id="syncState">Connecting…</b></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search">
        <span class="lens" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="Search books, discussions, circles…" aria-label="Search books, discussions, circles" autocomplete="off" />
      </div>
      <div class="topright">
        <button class="bell" id="bell" aria-label="Notifications">
          <span aria-hidden="true">🔔</span><span class="dot" id="bellDot" hidden></span><span class="count" id="bellCount" hidden>0</span>
        </button>
        <button class="userchip" id="meBtn" aria-haspopup="true"><span class="face" id="meFace">S</span><b id="meName">Reader</b><span aria-hidden="true">▾</span></button>
      </div>
    </div>
    <div class="drop" id="meDrop" hidden>
      <button id="goSettings">Open settings</button>
      <button id="logout">Sign out</button>
    </div>
    <div class="drop" id="bellDrop" hidden style="min-width:320px;max-width:360px"></div>
    <div class="content">
      <main class="feed" id="feed" aria-live="polite"></main>
      <aside class="railcards" aria-label="Recommendations and events">
        <section class="panel" aria-labelledby="tTrend"><h3 id="tTrend">🔥 Trending Books</h3><div id="trending"></div></section>
        <section class="panel" aria-labelledby="tRec"><h3 id="tRec">⭐ Recommended Books</h3><div id="recs"></div></section>
        <section class="panel" aria-labelledby="tEv"><h3 id="tEv">📅 Registered Events</h3><div id="myEvents"></div></section>
      </aside>
    </div>
  </div>
</div>
<script>
(function(){
  var API_KEY='rc_api_base';
  function base(){ return (localStorage.getItem(API_KEY)||'http://localhost:8080').replace(/\/+$/,''); }
  function tok(){ return localStorage.getItem('rc_access'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function needLogin(){ location.href='auth.html'; }
  if(!tok()){ needLogin(); return; }
  async function api(p,opt){
    opt=opt||{};
    var r=await fetch(base()+p,{method:opt.method||'GET',headers:Object.assign({Authorization:'Bearer '+tok()},opt.headers||{},{'Content-Type':'application/json'}),body:opt.body});
    if(r.status===401){ needLogin(); throw new Error('Session expired. Sign in again.'); }
    var d=null; try{ d=await r.json(); }catch(e){}
    if(!r.ok){ throw new Error((d&&(d.message||d.error))||('Request failed: '+r.status)); }
    return d;
  }
  var feed=document.getElementById('feed');
  function setSync(t){ document.getElementById('syncState').textContent=t; }
  function initials(n){ n=String(n||'R').trim(); return n?n[0].toUpperCase():'R'; }
  function coverFallback(el){ el.onerror=null; el.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340"><rect width="100%" height="100%" fill="#EFE6D2"/><text x="50%" y="52%" font-family="Georgia" font-size="26" text-anchor="middle" fill="#6B2A1F">Reader\u2019s Circle</text></svg>'); }
  window.rcCover=function(el){ coverFallback(el); };

  async function loadMe(){
    try{
      var me=await api('/api/users/me');
      document.getElementById('meName').textContent=me.name||me.email||'Reader';
      document.getElementById('meFace').textContent=initials(me.name||me.email);
    }catch(e){ /* keep defaults */ }
  }
  async function loadBell(){
    try{
      var u=await api('/api/notifications/unread-count');
      var n=Number(u.unreadCount||0);
      document.getElementById('bellCount').hidden=n<=0;
      document.getElementById('bellDot').hidden=n<=0;
      document.getElementById('bellCount').textContent=n;
      return n;
    }catch(e){ return 0; }
  }
  function postCard(d){
    var tags=(d.tags&&d.tags.length?d.tags:(d.tag?[d.tag]:[])).slice(0,4);
    var cover=d.coverImageUrl||'';
    return '<article class="post" data-id="'+esc(d.id)+'">'
      +'<div class="byline"><span class="face">'+esc(initials(d.createdBy))+'</span>'
      +'<div class="who"><b>'+esc(d.createdBy||'Member')+'</b><span>in '+esc(d.circleName||'Reading Circle')+' &nbsp;·&nbsp; '+esc(d.timeAgo||'')+'</span></div>'
      +'<span class="badge">💬 Discussion</span><button class="kebab" aria-label="More actions">···</button></div>'
      +'<div class="postgrid"><div><h2>'+esc(d.discussionTitle||d.bookTitle||'Discussion')+'</h2>'
      +'<p class="excerpt">'+esc(d.discussionExcerpt||'')+'</p>'
      +'<div class="tags">'+tags.map(function(t){return '<span>#'+esc(String(t).replace(/^#/,' '))+'</span>';}).join('')+'</div>'
      +'<div class="actions"><button class="like" data-like="'+esc(d.id)+'" aria-pressed="'+(!!d.userLiked)+'"><span class="h">♥</span> <span>'+esc(d.likesCount||0)+'</span></button>'
      +'<span>💬 '+esc(d.repliesCount||0)+'</span></div>'
      +'<div class="commentrow"><span class="face">'+esc(initials(document.getElementById('meName').textContent))+'</span>'
      +'<input data-comment="'+esc(d.id)+'" placeholder="Add a comment…" aria-label="Add a comment on '+esc(d.discussionTitle||'discussion')+'" /></div>'
      +'</div>'
      +(cover?'<img class="cover" src="'+esc(cover)+'" alt="Cover of '+esc(d.bookTitle||'book')+'" onerror="rcCover(this)" />':'')
      +'</div></article>';
  }
  function renderFeed(list){
    if(!list||!list.length){
      feed.innerHTML='<div class="notice"><b>No discussions yet.</b><br>Start one from the admin Discussions tab, or check back after circles post. Your admin dashboard shows the same list.</div>';
      return;
    }
    feed.innerHTML=list.map(postCard).join('');
  }
  function renderTrending(list){
    var el=document.getElementById('trending');
    if(!list||!list.length){ el.innerHTML='<div class="empty">No trending books yet.</div>'; return; }
    el.innerHTML=list.slice(0,3).map(function(b,i){
      return '<div class="rank"><span class="n">'+(i+1)+'</span>'
        +(b.coverImageUrl?'<img src="'+esc(b.coverImageUrl)+'" alt="Cover of '+esc(b.bookTitle||'')+'" onerror="rcCover(this)" />':'')
        +'<div><b>'+esc(b.bookTitle||'')+'</b><span>'+esc(b.author||'')+'</span><span>'+esc(b.discussionCount||b.discussions||0)+' discussions</span></div></div>';
    }).join('');
  }
  function renderRecs(list){
    var el=document.getElementById('recs');
    if(!list||!list.length){ el.innerHTML='<div class="empty">No recommendations yet.</div>'; return; }
    el.innerHTML=list.slice(0,3).map(function(b,i){
      var n=b.recommendedByCount!=null?b.recommendedByCount:(b.distinctRecommenders!=null?b.distinctRecommenders:(b.upvotesCount||0));
      return '<div class="rank"><span class="n">'+(i+1)+'</span>'
        +(b.coverImageUrl||b.coverUrl?'<img src="'+esc(b.coverImageUrl||b.coverUrl)+'" alt="Cover of '+esc(b.bookTitle||b.title||'')+'" onerror="rcCover(this)" />':'')
        +'<div><b>'+esc(b.bookTitle||b.title||'')+'</b><span>'+esc(b.author||'')+'</span><span>Recommended by '+esc(n)+' readers</span></div></div>';
    }).join('');
  }
  function renderMyEvents(list){
    var el=document.getElementById('myEvents');
    if(!list||!list.length){ el.innerHTML='<div class="empty"><b>Nothing registered</b>Browse events and reserve a seat. New bookings appear here and in admin counts.</div>'; return; }
    el.innerHTML=list.slice(0,4).map(function(e,i){
      var when=[e.eventDate,e.eventTime].filter(Boolean).join(' · ');
      return '<div class="ev"><span class="n">'+(i+1)+'</span>'
        +(e.coverImageUrl?'<img src="'+esc(e.coverImageUrl)+'" alt="" onerror="rcCover(this)" />':'')
        +'<div><b>'+esc(e.title||'')+'</b><span>'+esc(when)+'</span><span>'+esc(e.venue||e.circleName||'')+'</span></div></div>';
    }).join('');
  }
  async function loadAll(){
    setSync('Syncing with admin data…');
    feed.innerHTML='<div class="notice">Loading your reading home…</div>';
    try{
      var dash=await api('/api/dashboard?feedLimit=10');
      renderFeed(dash.feed||dash.discussions||[]);
      renderTrending(dash.trendingBooks||[]);
      var recs=dash.recommendedBooks||[];
      if(!recs.length){
        try{ recs=await api('/api/recommendations/books?limit=3&sort=recommended'); }catch(e){}
      }
      renderRecs(recs);
      renderMyEvents(dash.registeredEvents||[]);
      await loadBell();
      setSync('Synced with admin just now');
    }catch(e){
      // Fallback to individual endpoints so one failure never blanks the page
      try{
        var f=await api('/api/discussions');
        renderFeed(f);
        try{ renderTrending(await api('/api/books/trending?limit=3')); }catch(_){}
        try{ renderRecs(await api('/api/recommendations/books?limit=3')); }catch(_){}
        try{ renderMyEvents(await api('/api/users/me/registrations')); }catch(_){}
        setSync('Synced with admin just now');
      }catch(e2){
        feed.innerHTML='<div class="err">Could not reach the backend at '+esc(base())+'. Check the Spring Boot app on :8080, then reload.</div>';
        setSync('Offline');
      }
    }
  }
  // Likes + comments (event delegation answers the action)
  feed.addEventListener('click',async function(ev){
    var b=ev.target.closest('[data-like]');
    if(!b) return;
    var id=b.getAttribute('data-like');
    b.disabled=true;
    try{
      var r=await api('/api/discussions/'+id+'/like',{method:'POST'});
      var liked=r.liked;
      b.setAttribute('aria-pressed',liked?'true':'false');
      b.querySelector('span:last-child').textContent=r.likesCount;
    }catch(e){ alert(e.message); }
    finally{ b.disabled=false; }
  });
  feed.addEventListener('keydown',async function(ev){
    if(ev.key!=='Enter') return;
    var inp=ev.target.closest('[data-comment]');
    if(!inp||!inp.value.trim()) return;
    var id=inp.getAttribute('data-comment');
    inp.disabled=true;
    try{
      await api('/api/discussions/'+id+'/comments',{method:'POST',body:JSON.stringify({content:inp.value.trim()})});
      inp.value='';
      inp.placeholder='Posted. Thanks for adding to the discussion.';
      setTimeout(loadAll,800);
    }catch(e){ alert(e.message); inp.disabled=false; }
  });
  // Search
  var qt=null;
  document.getElementById('q').addEventListener('input',function(ev){
    clearTimeout(qt);
    var v=ev.target.value;
    qt=setTimeout(async function(){
      if(!v.trim()){ loadAll(); return; }
      try{
        var s=await api('/api/search?q='+encodeURIComponent(v.trim())+'&limit=5');
        var rows=(s.discussions||[]).map(function(x){return '<div class="rank"><div><b>'+esc(x.discussionTitle||x.bookTitle||'')+'</b><span>'+esc(x.author||'')+'</span></div></div>';}).join('')
          +(s.books||[]).map(function(x){return '<div class="rank"><div><b>'+esc(x.bookTitle||'')+'</b><span>Book · '+esc(x.author||'')+'</span></div></div>';}).join('');
        feed.innerHTML='<div class="notice">Results for “'+esc(v.trim())+'” — same circles, books and events admin sees.</div>'+(rows||'<div class="empty">No matches. Try a title, author or circle name.</div>');
      }catch(e){}
    },350);
  });
  // Bell dropdown
  document.getElementById('bell').addEventListener('click',async function(){
    var dd=document.getElementById('bellDrop');
    dd.hidden=!dd.hidden;
    if(dd.hidden) return;
    dd.innerHTML='Loading…';
    try{
      var list=await api('/api/notifications');
      dd.innerHTML=list.length?list.slice(0,6).map(function(n){
        return '<div style="padding:9px 11px;border-bottom:1px solid #F0EAD9"><b style="font-size:13px">'+esc(n.title)+'</b><div style="font-size:12px;color:#6B6257">'+esc(n.body||'')+'</div></div>';
      }).join('')+'<button id="markAll" style="border:0;background:none;color:#2F5D50;font-weight:700;padding:9px;cursor:pointer">Mark all read</button>'
        :'<div style="padding:12px;font-size:13px;color:#6B6257">No notifications. New event and reply alerts land here.</div>';
      var ma=document.getElementById('markAll');
      if(ma){ ma.onclick=function(){ api('/api/notifications/read-all',{method:'POST'}).then(function(){ loadBell(); dd.hidden=true; }); }; }
      loadBell();
    }catch(e){ dd.innerHTML='Could not load notifications.'; }
  });
  // User menu
  var meDrop=document.getElementById('meDrop');
  document.getElementById('meBtn').addEventListener('click',function(){ meDrop.hidden=!meDrop.hidden; });
  document.getElementById('logout').addEventListener('click',function(){ localStorage.removeItem('rc_access'); localStorage.removeItem('rc_refresh'); location.href='auth.html'; });
  document.getElementById('goSettings').addEventListener('click',function(){ location.href='reader-settings.html'; });
  loadMe(); loadAll();
})();
</script>
</body>
</html>
