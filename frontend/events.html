<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reader's Circle — Events (Admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<style>
h1.page{font-family:'Fraunces',serif;font-size:34px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 14px}
.headrow{display:flex;align-items:flex-end;gap:12px}.headrow .sp{flex:1}
.toolbar{display:flex;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.toolbar input,.toolbar select{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff}
.toolbar input[type=search]{flex:1;min-width:220px}
.btn{background:var(--burg);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.sm{padding:7px 14px;font-size:13px}
.etabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:12px}
.etabs button{border:0;background:none;padding:10px 2px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.etabs button.on{color:var(--burg);font-weight:700;border-bottom-color:var(--burg)}
.evrow{display:grid;grid-template-columns:52px 110px 1.2fr 1fr 130px 1.2fr auto auto auto;gap:12px;align-items:center;background:#FFFEFA;border:1px solid var(--border);border-radius:13px;padding:10px 12px;margin-bottom:10px}
.datebox{background:#F6E3D8;color:var(--burg);border-radius:10px;text-align:center;padding:7px 0}
.datebox b{display:block;font-size:19px;line-height:1}.datebox span{font-size:10.5px}
.evrow img{width:110px;height:56px;object-fit:cover;border-radius:8px;background:#EEE}
.evrow h4{margin:0;font-size:13.5px}.evrow p{margin:2px 0;font-size:12px;color:var(--muted)}
.evrow .cn{color:var(--burg);font-weight:700;font-size:12.5px}
.bar{height:5px;background:#E7E1D4;border-radius:99px;margin-top:5px}.bar i{display:block;height:100%;background:var(--burg);border-radius:99px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:4px 11px;background:#EAF3EA;color:#2C5A36;border:1px solid #CBE0CC;white-space:nowrap}
.pill.past{background:#ECEAE4;color:#5C6672;border-color:#D8D3C6}.pill.cancel{background:#F6E0E0;color:#7A2E2E;border-color:#E3BDBD}
.menuwrap{position:relative}.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:0 14px 34px rgba(61,41,22,.14);min-width:170px;z-index:10;display:none}
.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 13px;cursor:pointer;font-size:13px}.menu button:hover{background:#F6F1E7}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:6px}
.pager button{border:1px solid var(--border);background:#fff;border-radius:9px;min-width:32px;height:32px;cursor:pointer;font-weight:700}
.pager button.on{background:var(--burg);color:#fff;border-color:var(--burg)}
.footrow{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(30,20,15,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:26px 28px}
.sheet h2{font-family:'Fraunces',serif;margin:0;color:var(--burg);letter-spacing:.02em}
.fld{margin:12px 0}.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}
.fld .opt{font-weight:400;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.x{float:right;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.vcover{width:100%;height:180px;object-fit:cover;border-radius:12px;background:#EEE}
.vstatus{font-size:12px;font-weight:700;letter-spacing:.04em;margin:12px 0 2px}
.vtitle{font-family:'Fraunces',serif;color:var(--burg);font-size:24px;margin:0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F0EADB;font-size:13.5px}
.kv span{color:var(--muted)}
.err{border:1px solid #E3A9A9;background:#FDECEC;color:#7A1F1F;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.empty{text-align:center;padding:70px 10px;color:var(--muted)}
.empty b{font-family:'Fraunces',serif;color:var(--burg);display:block;font-size:19px;margin:12px 0 4px;letter-spacing:.03em}
.empty .ic{width:52px;height:52px;border-radius:50%;background:#F6E9E4;display:inline-grid;place-items:center;font-size:22px}
@media(max-width:1000px){.evrow{grid-template-columns:52px 1fr auto}.evrow .hideable{display:none}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="side" id="adminSide" aria-label="Admin navigation"></div>
<div class="main"><div class="topbar" id="adminHeader"></div>
<div class="content">
<div id="err" class="err" hidden></div>
<div class="headrow"><div><h1 class="page">EVENTS</h1><p class="sub">Manage and monitor events across all reading circles.</p></div><span class="sp" style="flex:1"></span><button class="btn" id="openCreate">+ Create New Event</button></div>
<div class="toolbar"><input type="search" id="q" placeholder="Search events by name, circle, location..."/><select id="fCircle"><option value="all">All Circles</option></select><select id="fSort"><option value="date_desc">Date (Newest First)</option><option value="date_asc">Date (Oldest First)</option><option value="newest">Recently Created</option><option value="name">Name A-Z</option></select></div>
<div class="etabs"><button data-t="upcoming" class="on" id="tabU">Upcoming Events (0)</button><button data-t="past" id="tabP">Past Events (0)</button><button data-t="cancelled" id="tabC">Cancelled Events (0)</button></div>
<div id="list"></div>
<div class="footrow"><p class="sub" id="showing"></p><div class="pager" id="pager"></div></div>
</div></div></div>

<div class="modal" id="modal"><div class="sheet">
<button class="x" id="cX" aria-label="Close">×</button>
<h2>CREATE NEW EVENT</h2><p class="sub">Schedule a reading event for a reading circle.</p>
<div id="cErr" class="err" hidden></div>
<div class="fld"><label for="cCircle">Circle</label><select id="cCircle"></select></div>
<div class="fld"><label for="cName">Event Name</label><input id="cName" placeholder="Enter event name"/></div>
<div class="fld"><label for="cTopic">Reading Topic</label><input id="cTopic" placeholder="What will members discuss?"/></div>
<div class="two"><div class="fld"><label for="cDate">Date</label><input id="cDate" type="date"/></div><div class="fld"><label for="cTime">Start Time</label><input id="cTime" type="time"/></div></div>
<div class="two"><div class="fld"><label for="cVenue">Venue</label><input id="cVenue" placeholder="Venue or meeting link"/></div><div class="fld"><label for="cCap">Capacity</label><input id="cCap" type="number" min="1" value="30"/></div></div>
<div class="fld"><label for="cDesc">Description</label><textarea id="cDesc" rows="3" placeholder="Add details about this event"></textarea></div>
<div class="fld"><label for="cCover">Cover Image URL <span class="opt">Optional</span></label><input id="cCover" placeholder="https://..."/></div>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="cCancel">Cancel</button><button class="btn" id="cGo">Create Event</button></div>
</div></div>

<div class="modal" id="vmodal"><div class="sheet">
<button class="x" id="vX" aria-label="Close">×</button>
<img class="vcover" id="vCover" alt=""/>
<div class="vstatus" id="vStatus"></div>
<h3 class="vtitle" id="vTitle"></h3>
<p class="sub" id="vTopic"></p>
<div class="kv"><span>Circle</span><b id="vCircle"></b></div>
<div class="kv"><span>Date</span><b id="vDate"></b></div>
<div class="kv"><span>Location</span><b id="vVenue"></b></div>
<div class="kv" style="border:0"><span>Registrations</span><b id="vReg"></b></div>
</div></div>

<script src="admin-shell.js?v=2"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
AdminShell.mount('events');
const base=()=>($('apiBase').value||'').replace(/\/+$/,'');
localStorage.getItem('rc_api_base')&&($('apiBase').value=localStorage.getItem('rc_api_base'));
$('apiBase').addEventListener('change',()=>localStorage.setItem('rc_api_base',base()));
const tok=()=>localStorage.getItem('rc_access')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showErr(m){const e=$('err');e.hidden=false;e.textContent=m;}
function hideErr(){$('err').hidden=true;}
async function api(p,o){o=o||{};o.headers=Object.assign({},o.headers||{});if(tok())o.headers.Authorization='Bearer '+tok();if(o.body&&typeof o.body==='string'&&!o.headers['Content-Type'])o.headers['Content-Type']='application/json';const r=await fetch(base()+p,o);const t=await r.text();let j={};try{j=t?JSON.parse(t):{};}catch(e){}if(!r.ok)throw new Error((j&&j.message)||('Failed '+r.status+' '+p));return j;}
const PAGE=8;
let all=[],tab='upcoming',page=1,circles=[];
const todayStr=()=>new Date().toISOString().slice(0,10);
function bucket(e){
  if(e.status==='CANCELLED')return 'cancelled';
  if(e.status==='COMPLETED'||(e.eventDate&&e.eventDate<todayStr()))return 'past';
  return 'upcoming';
}
async function gate(){
  if(!tok()){location.href='admin.html';return false;}
  try{
    const me=await api('/api/users/me');
    if(me.role!=='ADMIN'){showErr('Signed in as '+me.role+' — this page is admin-only.');return false;}
    $('meName').textContent=me.name||me.email;$('meRole').textContent='Administrator';$('meTop').textContent=me.name||me.email;$('meAv').textContent=(me.name||'A')[0].toUpperCase();
    return true;
  }catch(e){if(/401/.test(e.message)){AdminShell.clearLogin();}location.href='admin.html';return false;}
}
document.addEventListener('click',function(e){if(e.target&&e.target.id==='signOut'){AdminShell.clearLogin();location.href='admin.html';}});
async function loadCircles(){
  circles=await api('/api/circles?sort=name_asc');
  $('fCircle').innerHTML='<option value="all">All Circles</option>'+circles.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  $('cCircle').innerHTML=circles.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
}
async function load(){
  try{
    hideErr();
    const p=new URLSearchParams({search:$('q').value,circleId:$('fCircle').value,sort:$('fSort').value});
    all=await api('/api/events?'+p);
    page=1;render();
  }catch(e){showErr(e.message);}
}
function counts(){
  const c={upcoming:0,past:0,cancelled:0};
  all.forEach(e=>c[bucket(e)]++);
  return c;
}
function render(){
  const c=counts();
  $('tabU').textContent='Upcoming Events ('+c.upcoming+')';$('tabP').textContent='Past Events ('+c.past+')';$('tabC').textContent='Cancelled Events ('+c.cancelled+')';
  const rows=all.filter(e=>bucket(e)===tab);
  const pages=Math.max(1,Math.ceil(rows.length/PAGE));
  page=Math.min(page,pages);
  const slice=rows.slice((page-1)*PAGE,page*PAGE);
  if(!slice.length){
    const label=tab==='upcoming'?'NO UPCOMING EVENTS':tab==='past'?'NO PAST EVENTS':'NO CANCELLED EVENTS';
    $('list').innerHTML='<div class="empty"><span class="ic">📅</span><b>'+label+'</b>No events match the current filters.</div>';
  }else{
    $('list').innerHTML=slice.map(function(e){
      const d=(e.eventDate||'--').slice(5), m=(e.eventDate||'').slice(0,7);
      const pct=e.capacity?Math.min(100,Math.round(e.registeredCount/e.capacity*100)):0;
      const pill=tab==='upcoming'?'<span class="pill">Upcoming</span>':tab==='past'?'<span class="pill past">Past</span>':'<span class="pill cancel">Cancelled</span>';
      return '<div class="evrow"><div class="datebox"><b>'+esc(d.slice(3))+'</b><span>'+esc(m)+'</span></div>'
      +'<img alt="" src="'+(e.coverImageUrl||'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=220&auto=format&fit=crop&q=60')+'"/>'
      +'<div class="hideable"><h4>'+esc(e.title)+'</h4><p>'+esc(e.readingTopic||'')+'</p></div>'
      +'<div class="hideable"><div class="cn">'+esc(e.circleName||'')+'</div><p>'+esc((circles.find(function(x){return x.id===e.circleId;})||{}).category||'')+'</p></div>'
      +'<div class="hideable"><p>📍 '+esc(e.venue||'')+'</p><p>🕐 '+esc((e.eventTime||'').slice(0,5))+'</p></div>'
      +'<div><p>👥 '+e.registeredCount+' / '+(e.capacity||0)+'</p><div class="bar"><i style="width:'+pct+'%"></i></div></div>'
      +pill+'<button class="btn ghost sm" data-view="'+e.id+'">View</button>'
      +'<span class="menuwrap"><button class="btn ghost sm" data-menu="'+e.id+'">•••</button><span class="menu" id="m-'+e.id+'">'
      +'<button data-complete="'+e.id+'">Mark completed</button><button data-cancel="'+e.id+'">Cancel event</button>'
      +'</span></span></div>';
    }).join('');
  }
  const total=rows.length, from=total?(page-1)*PAGE+1:0, to=Math.min(total,page*PAGE);
  $('showing').textContent='Showing '+from+'–'+to+' of '+total+' events';
  let pg='<button data-pg="prev" '+(page<=1?'disabled':'')+'>‹</button>';
  for(let i=1;i<=pages;i++)pg+='<button data-pg="'+i+'" class="'+(i===page?'on':'')+'">'+i+'</button>';
  pg+='<button data-pg="next" '+(page>=pages?'disabled':'')+'>›</button>';
  $('pager').innerHTML=pages>1?pg:'';
}
document.querySelectorAll('.etabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.etabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;page=1;render();});
['q','fCircle','fSort'].forEach(id=>$(id).addEventListener('input',()=>load()));
document.addEventListener('click',function(e){
  const v=e.target&&e.target.getAttribute&&e.target.getAttribute('data-view');
  if(v){openView(v);return;}
  const pg=e.target&&e.target.getAttribute&&e.target.getAttribute('data-pg');
  if(pg){if(pg==='prev')page--;else if(pg==='next')page++;else page=parseInt(pg,10);render();return;}
  const m=e.target&&e.target.getAttribute&&e.target.getAttribute('data-menu');
  if(m){document.querySelectorAll('.menu').forEach(x=>{if(x.id!=='m-'+m)x.classList.remove('open');});$('m-'+m).classList.toggle('open');return;}
  if(!e.target.closest||!e.target.closest('.menuwrap'))document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));
  const done=e.target&&e.target.getAttribute&&e.target.getAttribute('data-complete');
  if(done){setStatus(done,'COMPLETED');return;}
  const cx=e.target&&e.target.getAttribute&&e.target.getAttribute('data-cancel');
  if(cx){setStatus(cx,'CANCELLED');return;}
});
async function setStatus(id,status){
  try{await api('/api/events/'+id,{method:'PATCH',body:JSON.stringify({status:status})});load();}catch(e){showErr(e.message);}
}
async function openView(id){
  try{
    const e=await api('/api/events/'+id);
    $('vCover').src=e.coverImageUrl||'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=800&auto=format&fit=crop&q=60';
    const st=$('vStatus');st.textContent=e.status;st.style.color=e.status==='PUBLISHED'?'#2C7A3B':e.status==='CANCELLED'?'#7A2E2E':'#5C6672';
    $('vTitle').textContent=e.title;$('vTopic').textContent=e.readingTopic||'';
    $('vCircle').textContent=e.circleName||'';$('vDate').textContent=(e.eventDate||'')+', '+((e.eventTime||'').slice(0,5));
    $('vVenue').textContent=e.venue||'';$('vReg').textContent=e.registeredCount+'/'+(e.capacity||0);
    $('vmodal').classList.add('open');
  }catch(e){showErr(e.message);}
}
$('vX').onclick=()=>$('vmodal').classList.remove('open');
$('vmodal').addEventListener('click',e=>{if(e.target.id==='vmodal')$('vmodal').classList.remove('open');});
$('openCreate').onclick=()=>{$('modal').classList.add('open');};
$('cX').onclick=$('cCancel').onclick=()=>$('modal').classList.remove('open');
$('cGo').onclick=async()=>{
  const e=$('cErr');e.hidden=true;
  try{
    const title=$('cName').value.trim(),date=$('cDate').value,time=$('cTime').value,venue=$('cVenue').value.trim();
    if(!$('cCircle').value||!title||!date||!time||!venue)throw new Error('Circle, event name, date, start time and venue are required to publish.');
    const start=new Date(date+'T'+time+':00Z');
    if(isNaN(start))throw new Error('Enter a valid date and start time.');
    const body={title:title,description:$('cDesc').value.trim()||null,readingTopic:$('cTopic').value.trim()||null,
      eventDate:date,eventTime:time.length===5?time+':00':time,venue:venue,
      capacity:parseInt($('cCap').value||'30',10),registrationDeadline:start.toISOString(),
      coverImageUrl:$('cCover').value.trim()||null,publishNow:true};
    await api('/api/circles/'+$('cCircle').value+'/events',{method:'POST',body:JSON.stringify(body)});
    $('modal').classList.remove('open');load();
  }catch(ex){e.hidden=false;e.textContent=ex.message;}
};
gate().then(ok=>{if(ok){loadCircles().then(load).catch(e=>showErr(e.message));}});
})();
</script>
</body>
</html>
