<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reader's Circle — Circles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6; --card:#FFFDF9; --border:#E5DED2; --soft:#F5EFE2;
  --ink:#241A12; --muted:#6B6257; --faint:#8A8175;
  --burgundy:#6B2A1F; --burgundy-deep:#4E1E15;
  --palm:#2F5D50; --marigold:#D9A21B; --pill:#F1EDE3;
  --green-bg:#E9F3EA; --green-tx:#2C5A36; --amber-bg:#FBF0DC; --amber-tx:#8A5A12; --red-bg:#FBE7E4; --red-tx:#8F2B22;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55}
:focus-visible{outline:3px solid var(--palm);outline-offset:2px;border-radius:8px}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--border);background:#FDFCF8;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--burgundy);color:#fff;display:grid;place-items:center;font-size:18px}
.brand b{font-family:'Fraunces',serif;font-size:17px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:#F3EEE1}
.nav a[aria-current="page"]{background:#F5E9DD;font-weight:700}
.syncnote{margin-top:auto;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);font-size:12px;color:var(--muted)}
.syncnote b{color:var(--palm)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 38px;background:#fff}
.search .lens{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.topright{margin-left:auto;display:flex;align-items:center;gap:12px}
.bell{position:relative;border:1px solid var(--border);background:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.bell .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#D33;border:2px solid #fff}
.bell .count{position:absolute;top:-6px;right:-6px;background:var(--burgundy);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px}
.userchip{display:flex;align-items:center;gap:9px;border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:12px}
.userchip .face{width:32px;height:32px;border-radius:50%;background:#EAD9C2;display:grid;place-items:center;font-weight:700}
.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:20px 26px 48px;max-width:1280px;width:100%;align-items:start}
h1.page{font-family:'Fraunces',serif;font-size:38px;margin:0;letter-spacing:-.015em}
.sub{color:var(--muted);margin:4px 0 14px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 2px;cursor:pointer;font-weight:500;color:var(--ink);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{font-weight:700;border-bottom-color:var(--burgundy)}
.tabs .cbadge{background:var(--burgundy);color:#fff;font-size:11px;font-weight:700;border-radius:7px;padding:1px 7px;margin-left:6px}
.secttl{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.secttl h2{font-family:'Fraunces',serif;font-size:22px;margin:0}
.countpill{background:var(--soft);border-radius:999px;font-size:12.5px;font-weight:600;padding:2px 12px;color:var(--ink)}
.secttl a{margin-left:auto;font-size:13px;color:var(--ink);font-weight:600;text-decoration:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.ccard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ccard img.cover{width:100%;height:132px;object-fit:cover;display:block;background:#EEE5D3}
.ccard .cb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ccard h4{margin:0;font-family:'Fraunces',serif;font-size:16.5px}
.ccard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.ccard .desc{font-size:12.5px;color:var(--muted);margin:0}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow span{background:var(--pill);border-radius:999px;padding:3px 10px;font-size:11.5px;color:#4A4238}
.cardbtn{margin-top:auto;border:0;border-radius:10px;padding:10px;font-weight:600;cursor:pointer;background:#F3E8D8;color:var(--ink)}
.cardbtn:hover{background:#EBDCC4}
.cardbtn.solid{background:var(--burgundy);color:#fff}
.cardbtn.solid:hover{background:var(--burgundy-deep)}
.cardbtn:disabled{opacity:.55;cursor:default}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h3{font-family:'Fraunces',serif;font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel h3 .cbadge{background:var(--burgundy);color:#fff;font-size:11px;border-radius:7px;padding:1px 7px}
.panel h3 a{margin-left:auto;font-size:12.5px;font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);text-decoration:none}
.req{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:9px;margin-bottom:9px;background:#FFFEFA}
.req img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;background:#EEE}
.req b{font-size:13px;display:block;line-height:1.3}
.req span{font-size:11.5px;color:var(--muted);display:block}
.statuspill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
.statuspill.pending{background:var(--amber-bg);color:var(--amber-tx)}
.statuspill.accepted{background:var(--green-bg);color:var(--green-tx)}
.statuspill.declined{background:var(--red-bg);color:var(--red-tx)}
.plainbtn{width:100%;border:0;border-radius:10px;background:#F3E8D8;padding:10px;font-weight:600;cursor:pointer}
.ghostbtn{border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
.frow{margin:10px 0}
.frow b{font-size:13px;display:block;margin-bottom:6px}
.check{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--burgundy)}
.radio{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;cursor:pointer}
.radio input{width:16px;height:16px;accent-color:var(--burgundy)}
.applybtn{width:100%;border:0;border-radius:10px;background:var(--burgundy);color:#fff;font-weight:700;padding:11px;cursor:pointer;margin-top:10px}
.clearbtn{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
.statline{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13.5px;border-bottom:1px solid #F0EAD9}
.statline:last-child{border-bottom:0}
.statline a{margin-left:auto;color:var(--faint);text-decoration:none}
.bigrow{border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:12px;background:var(--card)}
.bigrow img{width:110px;height:86px;object-fit:cover;border-radius:10px;background:#EEE}
.bigrow h4{margin:0;font-size:15.5px}
.bigrow p{margin:3px 0;font-size:12.5px;color:var(--muted)}
.bigrow .mrow{font-size:12px;color:var(--muted);display:flex;gap:14px;margin-top:4px}
.side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.howto{background:#FDF6E8}
.howto ol{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.howto li{display:flex;gap:10px;font-size:13px}
.howto .n{width:26px;height:26px;border-radius:50%;background:#F3E3C8;display:grid;place-items:center;font-weight:700;flex:none;font-size:12.5px}
.banner{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--card)}
.banner img.hero{width:100%;height:190px;object-fit:cover;display:block;background:#E5D6BC}
.chead{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;padding:16px 18px;align-items:start}
.chead img.thumb{width:120px;height:110px;object-fit:cover;border-radius:12px;background:#EEE}
.chead h2{font-family:'Fraunces',serif;font-size:27px;margin:0}
.memberpill{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green-tx);font-weight:700;font-size:12.5px;border-radius:9px;padding:6px 12px}
.evrow{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:14px;margin-bottom:12px;background:var(--card);align-items:center}
.evrow img{width:130px;height:100px;object-fit:cover;border-radius:10px;background:#EEE}
.evrow h4{margin:0;font-family:'Fraunces',serif;font-size:16px;color:var(--burgundy)}
.evrow p{margin:3px 0;font-size:12.5px;color:var(--muted)}
.evwhen{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:170px}
.orgrow{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1.2fr) auto;gap:14px;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card);align-items:start}
.orgrow img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#E5D6BC}
.orgrow h4{margin:0;font-size:15px}
.orgrow .loc{font-size:12px;color:var(--muted)}
.orgrow p.bio{font-size:13px;color:#3E352B;margin:0}
.memrow{display:grid;grid-template-columns:52px minmax(0,.9fr) minmax(0,1.4fr) auto;gap:12px;padding:11px 4px;border-bottom:1px solid #F0EAD9;align-items:start}
.memrow img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#E5D6BC}
.memrow h4{margin:0;font-size:14px}
.memrow .loc{font-size:11.5px;color:var(--muted)}
.rolepill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;background:#F3E3C8;color:#7A4A12}
.rolepill.member{background:#EEE9DC;color:#5C554A}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{background:#FFFEFA;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.mini b{font-family:'Fraunces',serif;font-size:21px;display:block}
.mini span{font-size:11.5px;color:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 .mini b{font-size:20px}
.cal{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.cal th{color:var(--faint);font-weight:600;padding:4px}
.cal td{padding:5px;border-radius:50%}
.cal td.ev{background:var(--burgundy);color:#fff;font-weight:700}
.cal td.dim{color:#C9C0B1}
.toolbar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff}
.toolbar select{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fff}
.notice{border:1px solid var(--border);border-radius:14px;padding:16px;background:#FFF8E8;font-size:13px}
.err{border:1px solid #E3A9A9;background:#FDECEC;color:#7A1F1F;border-radius:14px;padding:14px 16px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.drop{position:absolute;top:56px;right:20px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 44px rgba(36,26,18,.14);padding:8px;min-width:230px;z-index:20}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:9px;cursor:pointer}
.drop button:hover{background:#F5F0E4}
.backlink{display:inline-block;margin-bottom:10px;color:var(--ink);text-decoration:none;font-size:13.5px}
.aboutlist{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid #F0EAD9;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
.aboutlist li{display:flex;gap:10px}
.avatars{display:flex;align-items:center;margin-top:8px}
.avatars span{width:26px;height:26px;border-radius:50%;background:#E7DCC8;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-size:10px;font-weight:700;overflow:hidden}
.avatars span:first-child{margin-left:0}
.avatars img{width:100%;height:100%;object-fit:cover}
@media(max-width:1080px){.content{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.bigrow,.evrow{grid-template-columns:1fr}.orgrow,.memrow{grid-template-columns:52px 1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.grid3,.grid4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Reader navigation">
    <div class="brand"><span class="mark">📖</span><b>Reader's Circle</b></div>
    <nav class="nav">
      <a href="reader.html"><span>⌂</span> Dashboard</a>
      <a href="reader-circles.html" aria-current="page"><span>👥</span> Circles</a>
      <a href="reader-events.html"><span>📅</span> Events</a>
      <a href="reader-chat.html"><span>💬</span> Chat</a>
      <a href="reader-settings.html"><span>⚙</span> Settings</a>
    </nav>
    <div class="syncnote">Same circles admin manages.<br><b id="syncState">Connecting…</b></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search"><span class="lens" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="Search books, discussions, circles…" aria-label="Search books, discussions, circles" autocomplete="off" />
      </div>
      <div class="topright">
        <button class="bell" id="bell" aria-label="Notifications"><span aria-hidden="true">🔔</span><span class="dot" id="bellDot" hidden></span><span class="count" id="bellCount" hidden>0</span></button>
        <button class="userchip" id="meBtn"><span class="face" id="meFace">S</span><b id="meName">Reader</b><span aria-hidden="true">▾</span></button>
      </div>
    </div>
    <div class="drop" id="meDrop" hidden><button id="logout">Sign out</button></div>
    <div class="drop" id="bellDrop" hidden style="min-width:320px"></div>
    <div class="content">
      <main id="view" aria-live="polite" style="min-width:0"></main>
      <aside id="side" aria-label="Details"></aside>
    </div>
  </div>
</div>
<script>
(function(){
  var API_KEY='rc_api_base';
  function base(){ return (localStorage.getItem(API_KEY)||'http://localhost:8080').replace(/\/+$/,''); }
  function tok(){ return localStorage.getItem('rc_access'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  if(!tok()){ location.href='auth.html'; return; }
  async function api(p,opt){
    opt=opt||{};
    var r=await fetch(base()+p,{method:opt.method||'GET',headers:Object.assign({Authorization:'Bearer '+tok()},{'Content-Type':'application/json'}),body:opt.body});
    if(r.status===401){ location.href='auth.html'; throw new Error('Session expired. Sign in again.'); }
    var d=null; try{ d=await r.json(); }catch(e){}
    if(!r.ok){ var m=(d&&(d.message||d.error))||('Request failed: '+r.status); throw new Error(Array.isArray(m)?m.join(', '):m); }
    return d;
  }
  var view=document.getElementById('view'), side=document.getElementById('side');
  var FALLBACK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260"><rect width="100%" height="100%" fill="#EFE6D2"/><text x="50%" y="52%" font-family="Georgia" font-size="24" text-anchor="middle" fill="#6B2A1F">Reader\u2019s Circle</text></svg>');
  window.rcImg=function(el){ el.onerror=null; el.src=FALLBACK; };
  function setSync(t){ document.getElementById('syncState').textContent=t; }
  function initials(n){ n=String(n||'R').trim(); return n?n[0].toUpperCase():'R'; }
  function timeAgo(iso){
    if(!iso) return '';
    var t=new Date(iso).getTime(), diff=Date.now()-t;
    if(isNaN(diff)||diff<0) return '';
    var m=Math.floor(diff/60000);
    if(m<1) return 'just now'; if(m<60) return m+'m ago';
    var h=Math.floor(m/60); if(h<24) return (h===1?'an hour ago':h+' hours ago');
    var d=Math.floor(h/24); if(d===1) return 'a day ago'; if(d<7) return d+' days ago';
    var w=Math.floor(d/7); if(w<5) return (w===1?'a week ago':w+' weeks ago');
    return new Date(iso).toLocaleDateString();
  }
  function fmtDate(d){ if(!d) return ''; var x=new Date(d.length<=10?d+'T00:00:00':d); return isNaN(x)?String(d):x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  function fmtTime(t){ if(!t) return ''; var p=String(t).split(':'); var h=+p[0], m=p[1]||'00'; var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }
  function tagsOf(c){ var t=(c.tags&&c.tags.length?c.tags:(c.category?[c.category]:[])).slice(0,4); return t.map(function(x){return '<span>'+esc(x)+'</span>';}).join(''); }
  function circleTags(c){ return (c.tags&&c.tags.length?c.tags:(c.category?[c.category]:[])); }
  function route(){ var h=(location.hash||'#/my').replace(/^#\/?/,''); return h.split('/'); }
  function go(h){ location.hash='#/'+h; }

  /* ---------- shared data (same endpoints admin uses) ---------- */
  var cache={circles:null,events:null,mine:null,me:null};
  async function getCircles(force){
    if(!cache.circles||force){ cache.circles=await api('/api/circles?sort=name_asc'); }
    return cache.circles;
  }
  async function getEvents(force){
    if(!cache.events||force){ try{ cache.events=await api('/api/events'); }catch(e){ cache.events=[]; } }
    return cache.events;
  }
  async function getMine(force){
    if(!cache.mine||force){ cache.mine=await api('/api/users/me/memberships'); }
    return cache.mine;
  }
  async function upcomingCounts(){
    var ev=await getEvents();
    var map={};
    ev.forEach(function(e){
      var st=String(e.status||'').toUpperCase();
      if(st==='PUBLISHED'){ map[e.circleId]=(map[e.circleId]||0)+1; }
    });
    return map;
  }
  function myStatusMap(mine){ var m={}; (mine||[]).forEach(function(x){ m[x.circleId]={status:x.status,id:x.id}; }); return m; }

  function circleCard(c,up,st){
    var action='';
    if(!st) action='<button class="cardbtn" data-join="'+esc(c.id)+'">➕ Request to Join</button>';
    else if(st.status==='PENDING') action='<button class="cardbtn" disabled>Requested — pending</button>';
    else if(st.status==='APPROVED') action='<button class="cardbtn solid" data-open="'+esc(c.id)+'">Open Circle →</button>';
    else action='<button class="cardbtn" data-join="'+esc(c.id)+'">Request again</button>';
    return '<div class="ccard"><img class="cover" src="'+esc(c.coverImageUrl||FALLBACK)+'" alt="" onerror="rcImg(this)" />'
      +'<div class="cb"><h4>'+esc(c.name)+'</h4>'
      +'<div class="meta"><span>👥 '+esc(c.memberCount)+' members</span><span>📅 '+(up||0)+' upcoming events</span></div>'
      +'<p class="desc">'+esc(c.description||'')+'</p>'
      +'<div class="tagrow">'+tagsOf(c)+'</div>'+action+'</div></div>';
  }

  /* ---------- views ---------- */
  async function vMy(){
    setSync('Syncing with admin data…');
    var mine=await getMine(), circles=await getCircles(), up=await upcomingCounts();
    var sm=myStatusMap(mine);
    var approved=circles.filter(function(c){ return sm[c.id]&&sm[c.id].status==='APPROVED'; });
    var pending=mine.filter(function(x){ return x.status==='PENDING'; });
    var rec=[]; try{ rec=await api('/api/users/me/recommended-circles?limit=4'); }catch(e){}
    view.innerHTML='<h1 class="page">Circles</h1><p class="sub">Discover reading circles, join communities, and be part of meaningful discussions.</p>'
      +tabs('my',pending.length)

    async function refilter(){
      var q=document.getElementById('evQ').value, v=vs.value, mo=ms.value;
      var p='scope='+scope;
      if(v) p+='&venue='+encodeURIComponent(v);

    // calendar rail
    var calDate=new Date(); var calKey=calDate.toISOString().slice(0,7);

    paintCal(calKey);
    function paintCal(key){
      var y=+key.slice(0,4), mo=+key.slice(5,7)-1;
      var first=new Date(y,mo,1), startDay=first.getDay(), days=new Date(y,mo+1,0).getDate();
      var label=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
      var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="ghostbtn" id="calP">‹</button><b>'+label+'</b><button class="ghostbtn" id="calN">›</button></div>';
      html+='<table class="cal"><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr><tr>';
      var prevDays=new Date(y,mo,0).getDate();
      for(var i=startDay-1;i>=0;i--){ html+='<td class="dim">'+(prevDays-i)+'</td>'; }
      for(var d=1;d<=days;d++){
        var k=key+'-'+String(d).padStart(2,'0');
        html+=(evDates[k]?'<td class="ev">'+d+'</td>':'<td>'+d+'</td>');
        if((startDay+d)%7===0&&d!==days) html+='</tr><tr>';
      }
      html+='</tr></table>';
      document.getElementById('cal').innerHTML=html;
      document.getElementById('calP').onclick=function(){ var dt=new Date(y,mo-1,1); paintCal(dt.toISOString().slice(0,7)); };
      document.getElementById('calN').onclick=function(){ var dt=new Date(y,mo+1,1); paintCal(dt.toISOString().slice(0,7)); };
    }
  }

      +(o.past.map(function(x){return card(x,true);}).join('')||'<div class="empty">No past organizers.</div>');
    side.innerHTML=aboutRail(c)+await memPreview(id)+await evPreview(id)
      +'<section class="panel"><h3>📊 Circle Stats</h3><div class="minis"><div class="mini"><b>'+c.memberCount+'</b><span>Members</span></div><div class="mini"><b>'+ctx.upcoming+'</b><span>Events</span></div></div></section>';
  }

  async function vMembers(id){
    var ctx=await circleCtx(id), c=ctx.c;
    var s=await api('/api/circles/'+id+'/member-stats');
    var all=await api('/api/circles/'+id+'/members');
    var orgs=[]; try{ orgs=(await api('/api/circles/'+id+'/organizers')).current||[]; }catch(e){}
    var orgIds={}; orgs.forEach(function(o){ orgIds[o.userId]=1; });
    view.innerHTML='<a class="backlink" href="#/circle/'+id+'">← Back to '+esc(c.name)+'</a>'
      +'<h1 class="page">Circle Members <span class="countpill">'+s.totalMembers+'</span></h1><p class="sub">People who are part of this circle.</p>'
      +'<div class="toolbar"><div class="search" style="flex:1;min-width:180px;max-width:none"><span class="lens">🔍</span><input id="mQ" type="search" placeholder="Search members…" /></div>'
      +'<select id="mRole"><option value="all">All Roles</option><option value="ORGANIZER">Organizer</option><option value="READER">Reader</option></select></div>'
      +'<div id="memList"></div>';
    function paint(list){
      document.getElementById('memList').innerHTML=list.length?list.map(function(x){
        var isOrg=orgIds[x.readerId];
        return '<div class="memrow"><img src="'+esc(x.avatarUrl||FALLBACK)+'" alt="" onerror="rcImg(this)" /><div><h4>'+esc(x.readerName)+(isOrg?' 👑':'')+'</h4>'
          +'<span class="rolepill'+(isOrg?'':' member')+'">'+(isOrg?'Organizer':'Member')+'</span>'
          +'<div class="loc">📍 '+esc(x.city?x.city+', TN':x.city||'')+'</div><div class="loc">📅 Joined '+esc(fmtDate(x.requestedAt))+'</div></div>'
          +'<div><p class="bio" style="font-size:13px;margin:0">'+esc(x.bio||'')+'</p><div class="tagrow" style="margin-top:6px">'+((x.interests||[]).map(function(t){return '<span>'+esc(t)+'</span>';}).join(''))+'</div></div><div></div></div>';
      }).join(''):'<div class="empty">No members match.</div>';
    }
    paint(all);
    var deb=null;
    async function refilter(){
      var q=document.getElementById('mQ').value, rf=document.getElementById('mRole').value;
      var p='?'; if(rf&&rf!=='all') p+='role='+rf+'&';
      var list=await api('/api/circles/'+id+'/members'+p);
      if(q){ var l=q.toLowerCase(); list=list.filter(function(x){ return ((x.readerName||'')+' '+(x.bio||'')).toLowerCase().indexOf(l)>=0; }); }
      paint(list);
    }
    document.getElementById('mQ').addEventListener('input',function(){ clearTimeout(deb); deb=setTimeout(refilter,300); });
    document.getElementById('mRole').addEventListener('change',refilter);
    side.innerHTML=aboutRail(c)
      +'<section class="panel"><h3>📊 Member Stats</h3><div class="stat3"><div class="mini"><b>'+s.totalMembers+'</b><span>Total Members</span></div><div class="mini"><b>'+s.pendingRequests+'</b><span>Pending Requests</span></div><div class="mini"><b>'+s.regularMembers+'</b><span>Regular Members</span></div></div></section>';
  }

  /* ---------- actions (event delegation) ---------- */
  document.addEventListener('click',async function(e){
    var t=e.target.closest('[data-tab],[data-nav],[data-join],[data-open],[data-cancel],[data-register]');
    if(!t) return;
    if(t.hasAttribute('data-tab')||t.hasAttribute('data-nav')){ go(t.getAttribute('data-tab')||t.getAttribute('data-nav')); return; }
    if(t.hasAttribute('data-open')){ go('circle/'+t.getAttribute('data-open')); return; }
    try{
      if(t.hasAttribute('data-join')){
        t.disabled=true;
        await api('/api/circles/'+t.getAttribute('data-join')+'/join-requests',{method:'POST'});
        cache.mine=null; router();
      }else if(t.hasAttribute('data-cancel')){
        t.disabled=true;
        await api('/api/join-requests/'+t.getAttribute('data-cancel'),{method:'DELETE'});
        cache.mine=null; router();
      }else if(t.hasAttribute('data-register')){
        t.disabled=true; t.textContent='Registering…';
        await api('/api/events/'+t.getAttribute('data-register')+'/register',{method:'POST'});
        cache.events=null; t.textContent='Registered ✔'; router();
      }
    }catch(err){ alert(err.message); t.disabled=false; router(); }
  });
  document.getElementById('q').addEventListener('input',function(e){
    var v=e.target.value;
    clearTimeout(window.__qt); window.__qt=setTimeout(function(){ if(route()[0]==='explore'){ FILTERS.q=v; vExplore(); } },400);
  });

  /* ---------- chrome: me + bell ---------- */
  async function loadMe(){
    try{
      var me=await api('/api/users/me'); cache.me=me;
      document.getElementById('meName').textContent=me.name||me.email||'Reader';
      document.getElementById('meFace').textContent=initials(me.name||me.email);
    }catch(e){}
    try{
      var u=await api('/api/notifications/unread-count');
      var n=Number(u.unreadCount||0);
      document.getElementById('bellCount').hidden=n<=0;
      document.getElementById('bellDot').hidden=n<=0;
      document.getElementById('bellCount').textContent=n;
    }catch(e){}
  }
  document.getElementById('meBtn').addEventListener('click',function(){
    var d=document.getElementById('meDrop'); d.hidden=!d.hidden;
  });
  document.getElementById('logout').addEventListener('click',function(){
    localStorage.removeItem('rc_access'); localStorage.removeItem('rc_refresh'); location.href='auth.html';
  });
  document.getElementById('bell').addEventListener('click',async function(){
    var dd=document.getElementById('bellDrop'); dd.hidden=!dd.hidden;
    if(dd.hidden) return;
    dd.innerHTML='Loading…';
    try{
      var list=await api('/api/notifications');
      dd.innerHTML=list.length?list.slice(0,6).map(function(n){return '<div style="padding:9px 11px;border-bottom:1px solid #F0EAD9"><b style="font-size:13px">'+esc(n.title)+'</b><div style="font-size:12px;color:#6B6257">'+esc(n.body||'')+'</div></div>';}).join(''):'<div style="padding:12px;font-size:13px">No notifications.</div>';
    }catch(e){ dd.innerHTML='Could not load notifications.'; }
  });

  /* ---------- router ---------- */
  async function router(){
    var r=route(), name=r[0]||'my';
    try{
      if(name==='my') await vMy();
      else if(name==='explore') await vExplore();
      else if(name==='requests') await vRequests();
      else if(name==='circle'&&r[1]&&r[2]==='events'){
        var sc='upcoming', qi=(r[3]||'').indexOf('scope=');
        if(qi>=0) sc=(r[3].slice(qi+6).split('&')[0]||'upcoming');
        await vCircleEvents(r[1],sc);
      }
      else if(name==='circle'&&r[1]&&r[2]==='organizers') await vOrganizers(r[1]);
      else if(name==='circle'&&r[1]&&r[2]==='members') await vMembers(r[1]);
      else if(name==='circle'&&r[1]) await vDetail(r[1]);
      else await vMy();
    }catch(err){
      view.innerHTML='<div class="err">'+esc(err.message)+'</div>'; side.innerHTML='';
    }
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',router);
  loadMe(); router();
})();
</script>
</body>
</html>
